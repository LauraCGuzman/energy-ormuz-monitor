# Configuración de Streamlit para el Monitor Energético Ormuz.
# Estos valores son seguros para commitear (no contienen secretos).

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#262730"

[server]
headless = true

[browser]
gatherUsageStats = false
